spring.graphql.graphiql.enabled=true
spring.graphql.cors.allowed-origins=http://localhost:3000,http://localhost:4321

# Log every incoming request in development
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%t %a "%r" %s %b %D
spring.mvc.log-request-details=true

# Verbose Spring, GraphQL, and SQL logging
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
logging.level.org.springframework.graphql=DEBUG
logging.level.org.springframework.graphql.server=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE